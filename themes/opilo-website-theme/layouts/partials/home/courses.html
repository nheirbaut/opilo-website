<section class="section">
  <h2><a href="/courses" class="section-link">Offered Courses</a></h2>
  <div class="grid">
    {{ $coursesToShow := .Site.Params.coursesToShow | default 3 }}
    {{ $courses := where .Site.RegularPages "Section" "courses" }}
    {{ range first $coursesToShow (sort $courses "Date" "desc") }}
    <div class="card">
      <h3>{{- .Title -}}</h3>
      <p>{{- .Description -}}</p>
      <a href="{{ .RelPermalink }}" class="cta">Learn More</a>
    </div>
    {{ end }}
  </div>
</section>
